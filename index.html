<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 門市闖關儀表板</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#ECF0FF;--card:#fff;--card2:#F4F7FF;--border:#DDE4F5;
  --text:#1A2240;--text2:#3A4870;--muted:#7A8DB0;
  --shadow:0 2px 14px rgba(50,80,180,.08);--shadow-lg:0 8px 32px rgba(50,80,180,.13);
  --gold:#F59E0B;--gold2:#FBBF24;
  --green:#10B981;--blue:#3B82F6;
  --orange:#F97316;--red:#EF4444;--purple:#8B5CF6;--cyan:#06B6D4;
  --path:#C7D2F0;
  /* Player palettes */
  --p1a:#F97316;--p1b:#FBBF24;--p1c:#EA580C;   /* warrior: orange */
  --p2a:#6366F1;--p2b:#818CF8;--p2c:#4F46E5;   /* mage: indigo */
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Display','PingFang TC',sans-serif;min-height:100vh;overflow-x:hidden;}
#app{position:relative;min-height:100vh;}
.view{width:100%;min-height:100vh;display:none;}
.view.v-on{display:block;}

/* ════ MAP VIEW ════════════════════════════════ */
#view-map .hdr{background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow);padding:13px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-icon{font-size:26px;}
.brand-title{font-size:17px;font-weight:900;color:var(--text);}
.brand-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.hdr-right{display:flex;align-items:center;gap:8px;}
.year-sel{padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);background:var(--card);cursor:pointer;outline:none;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:700;transition:all .15s;white-space:nowrap;}
.btn-target{background:#EDE9FE;color:var(--purple);border:1.5px solid #C4B5FD;}
.btn-target:hover{background:#DDD6FE;}
.btn-upload{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;}
.btn-upload:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(245,158,11,.35);}
.btn-dl{background:var(--card2);color:var(--muted);border:1px solid var(--border);}
.btn-dl:hover{color:var(--blue);border-color:var(--blue);}
.file-inp{display:none;}
.map-main{max-width:1120px;margin:0 auto;padding:24px;}

/* Summary */
.sum-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px 28px;display:grid;grid-template-columns:repeat(3,auto) 1fr;align-items:center;margin-bottom:18px;}
.stat-col{text-align:center;padding:0 28px;border-right:1px solid var(--border);}
.stat-col:first-child{padding-left:0;}.stat-col:last-of-type{border-right:none;}
.stat-num{font-size:36px;font-weight:900;color:var(--gold);line-height:1;}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:4px;}
.mini-wrap{padding-left:28px;}
.mini-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px;}
.mini-row{display:flex;align-items:center;gap:6px;}
.mini-lbl{font-size:11px;color:var(--muted);width:52px;flex-shrink:0;}
.mini-trk{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.mini-fill{height:100%;border-radius:3px;transition:width .8s ease;}
.mini-val{font-size:11px;font-weight:700;color:var(--text2);width:34px;text-align:right;}

/* Map card */
.map-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);padding:28px 28px 24px;position:relative;overflow:hidden;}
.map-card::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='32' height='32' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='1' cy='1' r='1.2' fill='%23C7D2F0' fill-opacity='.5'/%3E%3C/svg%3E");pointer-events:none;}
.map-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:32px;}
.map-ttl{font-size:16px;font-weight:900;color:var(--text);display:flex;align-items:center;gap:8px;}
.map-hint{font-size:12px;color:var(--muted);margin-top:4px;}
.stage-world{position:relative;}
.stage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 12px;position:relative;z-index:1;}

/* Stage node */
.snode{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;border-radius:16px;padding:6px 4px;transition:transform .2s;position:relative;}
.snode:hover:not(.locked){transform:translateY(-6px);}
.snode.locked{cursor:default;opacity:.4;}
.orb{width:84px;height:84px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;transition:box-shadow .2s;border:3px solid transparent;}
.orb-s{background:linear-gradient(145deg,#FBBF24,#F59E0B);border-color:#D97706;color:#fff;}
.orb-a{background:linear-gradient(145deg,#34D399,#10B981);border-color:#059669;color:#fff;}
.orb-b{background:linear-gradient(145deg,#60A5FA,#3B82F6);border-color:#2563EB;color:#fff;}
.orb-c{background:linear-gradient(145deg,#FB923C,#F97316);border-color:#EA580C;color:#fff;}
.orb-d{background:linear-gradient(145deg,#F87171,#EF4444);border-color:#DC2626;color:#fff;}
.orb-active{background:linear-gradient(145deg,#FEF3C7,#FDE68A);border-color:var(--orange);color:var(--orange);animation:orb-pulse 2.2s ease-in-out infinite;}
.orb-locked{background:linear-gradient(145deg,#F1F5F9,#E2E8F0);border-color:#CBD5E1;color:#94A3B8;}
.snode:hover:not(.locked) .orb{box-shadow:0 10px 30px rgba(0,0,0,.18);}
@keyframes orb-pulse{0%,100%{box-shadow:0 4px 16px rgba(249,115,22,.2),0 0 0 0 rgba(249,115,22,.35);}50%{box-shadow:0 4px 16px rgba(249,115,22,.3),0 0 0 14px rgba(249,115,22,0);}}
.orb-num{font-size:9px;font-weight:800;opacity:.75;letter-spacing:.05em;line-height:1;}
.orb-icon{font-size:22px;line-height:1;}
.orb-pct{font-size:14px;font-weight:900;line-height:1;}
.slabel{text-align:center;}
.smonth{font-size:13px;font-weight:700;color:var(--text);}
.stag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:3px;}
.tag-s{background:#FEF3C7;color:#D97706;}.tag-a{background:#D1FAE5;color:#059669;}
.tag-b{background:#DBEAFE;color:#2563EB;}.tag-c{background:#FFEDD5;color:#EA580C;}
.tag-d{background:#FEE2E2;color:#DC2626;}.tag-active{background:#FFEDD5;color:#EA580C;}.tag-locked{background:#F1F5F9;color:#94A3B8;}
.tgt-dot{width:8px;height:8px;border-radius:50%;position:absolute;top:6px;right:6px;}
.dot-yes{background:var(--green);}.dot-no{background:#E2E8F0;border:1.5px solid #94A3B8;}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border);}
.leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);}

/* ════ STAGE VIEW ════════════════════════════════ */
#view-stage{background:var(--bg);}
.sv-hdr{padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,.2);}
.sv-back{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.25);border:1.5px solid rgba(255,255,255,.45);color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;transition:all .15s;backdrop-filter:blur(4px);}
.sv-back:hover{background:rgba(255,255,255,.4);}
.sv-info{display:flex;align-items:center;gap:10px;}
.sv-num{font-size:12px;font-weight:800;color:rgba(255,255,255,.7);letter-spacing:.08em;}
.sv-mname{font-size:20px;font-weight:900;color:#fff;}
.sv-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.3);}
.sv-acts{display:flex;gap:8px;}
.sv-btn{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.38);color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;transition:all .15s;}
.sv-btn:hover{background:rgba(255,255,255,.32);}
.sv-body{max-width:960px;margin:0 auto;padding:28px 24px 56px;}

/* Store hero row */
.sv-hero{background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);padding:24px 28px;display:flex;align-items:center;gap:24px;margin-bottom:20px;}
.hero-icon{font-size:50px;flex-shrink:0;}
.hero-pct{font-size:60px;font-weight:900;line-height:1;flex-shrink:0;}
.hero-right{flex:1;}
.hero-lbl{font-size:13px;color:var(--muted);margin-bottom:10px;}
.hero-bar-trk{height:12px;background:var(--border);border-radius:6px;overflow:hidden;margin-bottom:6px;}
.hero-bar-fill{height:100%;border-radius:6px;transition:width .9s ease;}
.hero-sub{font-size:12px;color:var(--muted);}

/* ── PLAYER CARDS ─────────────────────────────── */
.sv-sec{margin-bottom:20px;}
.sv-sec-title{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;display:flex;align-items:center;gap:6px;}

.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}

/* Player card */
.pcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px;border:2px solid transparent;position:relative;overflow:hidden;}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.pcard.p1{border-color:rgba(249,115,22,.2);}
.pcard.p1::before{background:linear-gradient(90deg,var(--p1a),var(--p1b));}
.pcard.p2{border-color:rgba(99,102,241,.2);}
.pcard.p2::before{background:linear-gradient(90deg,var(--p2a),var(--p2b));}

/* Character figure */
.pcard-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;}
.char-wrap{display:flex;flex-direction:column;align-items:center;gap:0;flex-shrink:0;}

/* Hat */
.char-hat{width:0;height:0;margin-bottom:-1px;}
.p1 .char-hat{border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:10px solid var(--p1b);}
.p2 .char-hat{width:20px;height:12px;background:var(--p2b);border-radius:50% 50% 0 0;}

/* Head */
.char-head{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.15);position:relative;flex-shrink:0;}
.p1 .char-head{background:linear-gradient(145deg,var(--p1b),var(--p1a));}
.p2 .char-head{background:linear-gradient(145deg,var(--p2b),var(--p2a));}
/* Face dot eyes */
.char-head::after{content:'';position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:10px;height:3px;background:rgba(255,255,255,.6);border-radius:2px;}

/* Body */
.char-body{width:28px;height:22px;border-radius:6px 6px 3px 3px;position:relative;margin-top:2px;}
.p1 .char-body{background:var(--p1a);}
.p2 .char-body{background:var(--p2a);}
/* Arms */
.char-arms{display:flex;gap:2px;margin-top:1px;}
.char-arm{width:8px;height:14px;border-radius:4px;}
.p1 .char-arm{background:var(--p1a);}
.p2 .char-arm{background:var(--p2a);}
/* Legs */
.char-legs{display:flex;gap:4px;margin-top:2px;}
.char-leg{width:10px;height:16px;border-radius:0 0 5px 5px;}
.p1 .char-leg{background:var(--p1c);}
.p2 .char-leg{background:var(--p2c);}

/* Type label under char */
.char-type{font-size:10px;font-weight:800;margin-top:5px;text-align:center;}
.p1 .char-type{color:var(--p1a);}
.p2 .char-type{color:var(--p2a);}

/* Player info right of character */
.pcard-info{flex:1;min-width:0;}
.pcard-name{font-size:18px;font-weight:900;color:var(--text);line-height:1;margin-bottom:4px;}
.pcard-contrib-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.pcard-contrib-pct{font-size:28px;font-weight:900;line-height:1;}
.p1 .pcard-contrib-pct{color:var(--p1a);}
.p2 .pcard-contrib-pct{color:var(--p2a);}
.pcard-contrib-lbl{font-size:11px;color:var(--muted);line-height:1.3;}

/* Main progress track with character ON it */
.pcard-track-wrap{position:relative;margin-bottom:6px;margin-top:8px;}
.pcard-track{height:14px;background:var(--border);border-radius:7px;overflow:visible;position:relative;}
.pcard-fill{height:100%;border-radius:7px;transition:width .9s cubic-bezier(.4,0,.2,1);position:relative;}
.p1 .pcard-fill{background:linear-gradient(90deg,var(--p1a),var(--p1b));}
.p2 .pcard-fill{background:linear-gradient(90deg,var(--p2a),var(--p2b));}
/* Character on track */
.char-on-track{position:absolute;top:-26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;}
.char-mini-head{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.p1 .char-mini-head{background:linear-gradient(145deg,var(--p1b),var(--p1a));}
.p2 .char-mini-head{background:linear-gradient(145deg,var(--p2b),var(--p2a));}
.char-mini-body{width:3px;height:6px;border-radius:0 0 2px 2px;}
.p1 .char-mini-body{background:var(--p1a);}
.p2 .char-mini-body{background:var(--p2a);}
/* Fair share marker */
.fair-marker{position:absolute;top:-8px;bottom:-8px;width:2px;background:rgba(0,0,0,.15);border-radius:1px;pointer-events:none;}
.fair-label{position:absolute;top:-22px;transform:translateX(-50%);font-size:9px;color:var(--muted);white-space:nowrap;font-weight:700;background:var(--card);padding:0 3px;border-radius:3px;}
/* 100% finish line */
.finish-line{position:absolute;right:0;top:-8px;bottom:-8px;width:2px;background:var(--green);border-radius:1px;}
.finish-label{position:absolute;right:0;top:-22px;font-size:9px;color:var(--green);font-weight:800;}
.track-labels{display:flex;justify-content:space-between;margin-top:4px;}
.track-lbl{font-size:10px;color:var(--muted);}

/* Metric mini-bars */
.pcard-metrics{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;border-top:1px solid var(--border);padding-top:14px;margin-top:6px;}
.pm-row{display:flex;align-items:center;gap:5px;}
.pm-lbl{font-size:10px;color:var(--muted);width:40px;flex-shrink:0;}
.pm-trk{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.pm-fill{height:100%;border-radius:3px;transition:width .8s ease;}
.pm-val{font-size:10px;font-weight:700;color:var(--text2);width:26px;text-align:right;flex-shrink:0;}

/* Inline target panel */
.tgt-panel{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;}
.tgt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:16px;}
.tgt-grp{display:flex;flex-direction:column;gap:4px;}
.tgt-lbl{font-size:11px;font-weight:700;color:var(--text2);}
.tgt-inp{padding:8px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);background:var(--card2);outline:none;transition:border-color .15s;width:100%;}
.tgt-inp:focus{border-color:var(--purple);}
.tgt-row-btn{display:flex;align-items:center;justify-content:space-between;}
.tgt-note{font-size:12px;color:var(--muted);}
.tgt-save{padding:10px 22px;background:var(--purple);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer;transition:background .15s;}
.tgt-save:hover{background:#7C3AED;}

/* No data */
.nodata{text-align:center;padding:48px 16px;}
.nodata-icon{font-size:52px;margin-bottom:14px;}
.nodata h3{font-size:17px;color:var(--text);margin-bottom:8px;}
.nodata p{font-size:13px;color:var(--muted);margin-bottom:20px;}

/* Target modal */
.t-overlay{position:fixed;inset:0;background:rgba(20,30,80,.4);backdrop-filter:blur(5px);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;opacity:0;pointer-events:none;transition:opacity .2s;}
.t-overlay.open{opacity:1;pointer-events:all;}
.t-modal{background:var(--card);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.2);width:100%;max-width:580px;max-height:calc(100vh - 56px);overflow-y:auto;transform:translateY(-18px);transition:transform .2s;}
.t-overlay.open .t-modal{transform:translateY(0);}
.t-head{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.t-title{font-size:17px;font-weight:900;color:var(--text);}
.t-body{padding:20px 24px 28px;}
.close-btn{background:var(--card2);border:1px solid var(--border);color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.close-btn:hover{color:var(--red);border-color:var(--red);}
.m-tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:20px;}
.m-tab{padding:7px 4px;border-radius:8px;border:1.5px solid var(--border);background:var(--card2);font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;text-align:center;transition:all .15s;}
.m-tab.on{background:var(--purple);border-color:var(--purple);color:#fff;}
.m-tab.has-d{border-color:#C4B5FD;color:var(--purple);}
.inp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.inp-g{display:flex;flex-direction:column;gap:5px;}
.inp-lbl{font-size:12px;font-weight:700;color:var(--text2);}
.inp-f{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;color:var(--text);background:var(--card);outline:none;transition:border-color .15s;width:100%;}
.inp-f:focus{border-color:var(--purple);}
.save-btn{width:100%;padding:12px;background:var(--purple);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;transition:background .15s;}
.save-btn:hover{background:#7C3AED;}

/* ── SPEECH BUBBLE ── */
.speech-bubble{background:#fff;border:2px solid;border-radius:10px 10px 10px 3px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap;margin-bottom:6px;position:relative;animation:bubble-in .5s cubic-bezier(.175,.885,.32,1.275) both;text-align:center;max-width:130px;line-height:1.3;}
.speech-bubble::after{content:'';position:absolute;bottom:-7px;left:12px;border:4px solid transparent;}
.p1 .speech-bubble{color:var(--p1a);border-color:var(--p1a);}
.p1 .speech-bubble::after{border-top-color:var(--p1a);}
.p2 .speech-bubble{color:var(--p2a);border-color:var(--p2a);}
.p2 .speech-bubble::after{border-top-color:var(--p2a);}
@keyframes bubble-in{0%{transform:scale(0) translateY(8px);opacity:0;}100%{transform:scale(1) translateY(0);opacity:1;}}

/* ── SHIMMER on progress fill ── */
.pcard-fill{overflow:hidden;position:relative;}
.pcard-fill::after{content:'';position:absolute;top:0;bottom:0;width:50px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:bar-shimmer 1.8s linear infinite;}
@keyframes bar-shimmer{0%{left:-50px;}100%{left:100%;}}

/* ── CHARACTER BOUNCE on track ── */
.char-on-track{animation:char-hop 1.1s ease-in-out infinite;}
@keyframes char-hop{0%,100%{transform:translateX(-50%) translateY(0);}40%{transform:translateX(-50%) translateY(-7px);}70%{transform:translateX(-50%) translateY(-2px);}}

/* ── CONFETTI ── */
.confetti-box{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:20px;z-index:2;}
.cf{position:absolute;top:-14px;animation:cf-fall linear forwards;}
@keyframes cf-fall{to{transform:translateY(260px) rotate(720deg);opacity:0;}}

/* ── STORE DIALOGUE BANNER ── */
.store-line{border-radius:12px;padding:11px 18px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800;border-left:5px solid;}

/* ── HERO WARNING PULSE (D grade) ── */
.hero-danger{animation:danger-pulse 1.8s ease-in-out infinite;}
@keyframes danger-pulse{0%,100%{box-shadow:var(--shadow-lg);}50%{box-shadow:0 0 0 6px rgba(239,68,68,.2),var(--shadow-lg);}}

/* ── HERO CELEBRATE (S/A grade) ── */
.hero-celebrate{animation:celebrate-glow 2s ease-in-out infinite;}
@keyframes celebrate-glow{0%,100%{box-shadow:var(--shadow-lg);}50%{box-shadow:0 0 0 6px rgba(16,185,129,.18),var(--shadow-lg);}}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;background:var(--card);box-shadow:var(--shadow-lg);border:1px solid var(--border);z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{border-left:4px solid var(--green);}
.toast.err{border-left:4px solid var(--red);}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
@media(max-width:700px){
  .stage-grid{grid-template-columns:repeat(3,1fr);}
  .sum-card{grid-template-columns:repeat(2,1fr);}
  .mini-wrap{padding-left:0;padding-top:14px;}
  .sv-hero{flex-direction:column;align-items:flex-start;gap:16px;}
  .hero-pct{font-size:42px;}
  .players-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app">

<!-- ════ MAP VIEW ════ -->
<div id="view-map" class="view v-on">
  <header class="hdr">
    <div class="brand">
      <span class="brand-icon">🎮</span>
      <div>
        <div class="brand-title">門市闖關儀表板</div>
        <div class="brand-sub">業績目標達成追蹤系統</div>
      </div>
    </div>
    <div class="hdr-right">
      <select class="year-sel" id="yearSel" onchange="setYear(+this.value)"></select>
      <button class="btn btn-target" onclick="openTargetModal()">📋 設定月份目標</button>
      <button class="btn btn-upload" onclick="document.getElementById('fileInp').click()">⬆ 上傳業績 Excel</button>
      <button class="btn btn-dl" onclick="dlTemplate()">⬇ 範本</button>
      <input type="file" id="fileInp" class="file-inp" accept=".xlsx,.xls" onchange="handleUpload(event)">
    </div>
  </header>
  <main class="map-main">
    <div class="sum-card">
      <div class="stat-col"><div class="stat-num" id="sCleared">0</div><div class="stat-lbl">月份已達標</div></div>
      <div class="stat-col"><div class="stat-num" id="sAvg">--</div><div class="stat-lbl">年度平均達成率</div></div>
      <div class="stat-col"><div class="stat-num" id="sActive">--</div><div class="stat-lbl">當前關卡</div></div>
      <div class="mini-wrap">
        <div class="mini-title">各指標年度平均</div>
        <div class="mini-grid">
          <div class="mini-row"><span class="mini-lbl">銷售額</span><div class="mini-trk"><div class="mini-fill" id="mf0" style="background:var(--gold)"></div></div><span class="mini-val" id="mv0">--</span></div>
          <div class="mini-row"><span class="mini-lbl">AppleCare</span><div class="mini-trk"><div class="mini-fill" id="mf1" style="background:var(--green)"></div></div><span class="mini-val" id="mv1">--</span></div>
          <div class="mini-row"><span class="mini-lbl">配件率</span><div class="mini-trk"><div class="mini-fill" id="mf2" style="background:var(--blue)"></div></div><span class="mini-val" id="mv2">--</span></div>
          <div class="mini-row"><span class="mini-lbl">主商品</span><div class="mini-trk"><div class="mini-fill" id="mf3" style="background:var(--purple)"></div></div><span class="mini-val" id="mv3">--</span></div>
        </div>
      </div>
    </div>
    <div class="map-card">
      <div class="map-hdr">
        <div>
          <div class="map-ttl">🗺 <span id="mapLbl">2026</span> 年度闖關地圖</div>
          <div class="map-hint">點擊關卡進入玩家進度介面 · 綠點＝目標已設定</div>
        </div>
      </div>
      <div class="stage-world">
        <div class="stage-grid" id="stageGrid"></div>
      </div>
      <div class="legend">
        <div class="leg">⭐ S ≥100%</div><div class="leg">✅ A 85-99%</div>
        <div class="leg">🔵 B 70-84%</div><div class="leg">🔶 C 55-69%</div>
        <div class="leg">💀 D &lt;55%</div><div class="leg">🔥 進行中</div><div class="leg">🔒 未開始</div>
        <div class="leg" style="margin-left:auto">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:4px"></span>目標已設定
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#E2E8F0;border:1.5px solid #94A3B8;margin:0 4px 0 10px"></span>目標未設定
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ════ STAGE VIEW ════ -->
<div id="view-stage" class="view">
  <div id="sv-hdr" class="sv-hdr">
    <button class="sv-back" onclick="goMap()">← 返回地圖</button>
    <div class="sv-info">
      <span class="sv-num" id="sv-num">STAGE 1</span>
      <span class="sv-mname" id="sv-mname">1月</span>
      <span class="sv-badge" id="sv-badge">--</span>
    </div>
    <div class="sv-acts">
      <button class="sv-btn" onclick="openTargetModal(currentStage)">📋 設定本月目標</button>
      <button class="sv-btn" onclick="document.getElementById('fileInp').click()">⬆ 上傳業績</button>
    </div>
  </div>
  <div class="sv-body" id="sv-body"></div>
</div>

</div><!-- #app -->

<!-- TARGET MODAL -->
<div class="t-overlay" id="tOverlay" onclick="if(event.target===this)closeTargetModal()">
  <div class="t-modal">
    <div class="t-head">
      <div class="t-title">📋 設定月份目標</div>
      <button class="close-btn" onclick="closeTargetModal()">✕</button>
    </div>
    <div class="t-body">
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px">請對照當月目標 PDF，逐項填入數字後按「儲存目標」。</p>
      <div class="m-tabs" id="mTabs"></div>
      <div class="inp-grid" id="tForm"></div>
      <button class="save-btn" onclick="saveTargetModal()">✅ 儲存目標</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Constants ─────────────────────────────────────
const MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const METRICS=[
  {key:'sales',   lbl:'銷售額',    tLbl:'銷售額目標（元）',    unit:'元', color:'#F59E0B'},
  {key:'accRate', lbl:'配件率',    tLbl:'配件率目標（%）',     unit:'%',  color:'#3B82F6'},
  {key:'ac',      lbl:'AppleCare', tLbl:'AppleCare 目標（台）',unit:'台', color:'#10B981'},
  {key:'iphone',  lbl:'iPhone',    tLbl:'iPhone 目標（台）',   unit:'台', color:'#8B5CF6'},
  {key:'mac',     lbl:'Mac',       tLbl:'Mac 目標（台）',      unit:'台', color:'#F97316'},
  {key:'ipad',    lbl:'iPad',      tLbl:'iPad 目標（台）',     unit:'台', color:'#06B6D4'},
  {key:'watch',   lbl:'Watch',     tLbl:'Watch 目標（台）',    unit:'台', color:'#EF4444'},
];
const DOM_ORDER=[1,2,3,4,8,7,6,5,9,10,11,12];
const GRADE={
  icon:{s:'⭐',a:'✅',b:'🔵',c:'🔶',d:'💀',active:'🔥',locked:'🔒'},
  lbl:{s:'S 完美達標',a:'A 達標',b:'B 良好',c:'C 待加強',d:'D 未達標',active:'進行中',locked:'未開始'},
  color:{s:'#F59E0B',a:'#10B981',b:'#3B82F6',c:'#F97316',d:'#EF4444',active:'#F97316',locked:'#94A3B8'},
  bg:{s:'linear-gradient(135deg,#F59E0B,#D97706)',a:'linear-gradient(135deg,#10B981,#059669)',b:'linear-gradient(135deg,#3B82F6,#2563EB)',c:'linear-gradient(135deg,#F97316,#EA580C)',d:'linear-gradient(135deg,#EF4444,#DC2626)',active:'linear-gradient(135deg,#F97316,#EA580C)',locked:'linear-gradient(135deg,#94A3B8,#64748B)'},
};
const PLAYER_TYPE=['p1','p2'];
const PLAYER_LABEL=['⚔️ 戰士','🔮 法師'];

// ── State ─────────────────────────────────────────
const S={year:new Date().getFullYear(),perf:null};
let currentStage=1,tModalMonth=1;

// ── Helpers ───────────────────────────────────────
const $=id=>document.getElementById(id);
const fmtN=n=>(n==null||n==='')?'--':Number(n).toLocaleString('zh-TW');
const parseN=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isNaN(n)?0:n;};
const cap=(v,mx=100)=>Math.min(Math.max(v??0,0),mx);
function gradeOf(p){if(p==null)return 'locked';if(p>=100)return 's';if(p>=85)return 'a';if(p>=70)return 'b';if(p>=55)return 'c';return 'd';}
const lsKey=t=>`stk_${t}_${S.year}`;
function loadTgts(){try{return JSON.parse(localStorage.getItem(lsKey('tgt'))||'{}')}catch{return{};}}
function saveTgts(o){localStorage.setItem(lsKey('tgt'),JSON.stringify(o));}
function loadPerf(){try{return JSON.parse(localStorage.getItem(lsKey('perf'))||'null')}catch{return null;}}
function savePerf(o){localStorage.setItem(lsKey('perf'),JSON.stringify(o));}

// ── Calc ──────────────────────────────────────────
function calcMonth(m){
  const targets=loadTgts()[m]||{};
  const md=S.perf?.months?.[m];
  if(!md?.staffRows?.length) return null;
  const rows=md.staffRows;
  const tot={};
  for(const r of rows) for(const mk of METRICS){if(mk.key!=='accRate')tot[mk.key]=(tot[mk.key]||0)+(r[mk.key]||0);}
  const mainK=['iphone','mac','ipad','watch'];
  let an=0,ad=0;
  for(const r of rows){const u=mainK.reduce((s,k)=>s+(r[k]||0),0);an+=(r.accRate||0)*u;ad+=u;}
  tot.accRate=ad>0?an/ad:0;
  const rates={};
  for(const mk of METRICS){const t=targets[mk.key];rates[mk.key]=(t&&t>0)?Math.round((tot[mk.key]||0)/t*100):null;}
  const mainR=mainK.map(k=>rates[k]).filter(v=>v!=null);
  const mainAvg=mainR.length?Math.round(mainR.reduce((a,b)=>a+b,0)/mainR.length):null;
  const all=Object.values(rates).filter(v=>v!=null);
  const overall=all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length):null;
  return{tot,rates,overall,mainAvg,targets};
}

function monthStatus(m){
  const now=new Date(),cy=now.getFullYear(),cm=now.getMonth()+1;
  const hasPerf=!!(S.perf?.months?.[m]?.staffRows?.length);
  if(S.year<cy)return hasPerf?'done':'locked';
  if(S.year>cy)return 'locked';
  if(m<cm)return hasPerf?'done':'locked';
  if(m===cm)return 'active';
  return 'locked';
}

// ── Map Render ────────────────────────────────────
function renderStages(){
  const grid=$('stageGrid');grid.innerHTML='';
  const tgts=loadTgts();
  for(const m of DOM_ORDER){
    const st=monthStatus(m),calc=(st!=='locked')?calcMonth(m):null;
    const pct=calc?.overall??null;
    const grade=st==='active'?'active':st==='locked'?'locked':gradeOf(pct);
    const hasTgt=!!(tgts[m]&&Object.values(tgts[m]).some(v=>v>0));
    const node=document.createElement('div');
    node.className=`snode${grade==='locked'?' locked':''}`;
    node.dataset.month=m;
    if(grade!=='locked')node.onclick=()=>goStage(m);
    node.innerHTML=`
      <div class="tgt-dot ${hasTgt?'dot-yes':'dot-no'}"></div>
      <div class="orb orb-${grade}">
        <span class="orb-num">STAGE ${m}</span>
        <span class="orb-icon">${GRADE.icon[grade]}</span>
        <span class="orb-pct">${pct!==null?pct+'%':'--'}</span>
      </div>
      <div class="slabel">
        <div class="smonth">${MONTHS[m-1]}</div>
        <div class="stag tag-${grade}">${GRADE.lbl[grade]}</div>
      </div>`;
    grid.appendChild(node);
  }
  requestAnimationFrame(()=>requestAnimationFrame(drawPath));
}

function drawPath(){
  const grid=$('stageGrid');
  const old=grid.querySelector('.path-svg');if(old)old.remove();
  const gr=grid.getBoundingClientRect();
  const pts=[];
  for(let m=1;m<=12;m++){
    const node=grid.querySelector(`[data-month="${m}"]`);
    const orb=node?.querySelector('.orb');if(!orb)continue;
    const r=orb.getBoundingClientRect();
    pts.push({x:r.left-gr.left+r.width/2,y:r.top-gr.top+r.height/2});
  }
  if(pts.length<2)return;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.classList.add('path-svg');
  svg.setAttribute('width',gr.width);svg.setAttribute('height',gr.height);
  svg.style.cssText='position:absolute;top:0;left:0;pointer-events:none;z-index:0;';
  let d=`M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let i=1;i<pts.length;i++){
    const p=pts[i-1],c=pts[i],mx=(p.x+c.x)/2;
    d+=` C ${mx.toFixed(1)},${p.y.toFixed(1)} ${mx.toFixed(1)},${c.y.toFixed(1)} ${c.x.toFixed(1)},${c.y.toFixed(1)}`;
  }
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',d);path.setAttribute('fill','none');
  path.setAttribute('stroke','var(--path)');path.setAttribute('stroke-width','3');
  path.setAttribute('stroke-dasharray','8 5');path.setAttribute('stroke-linecap','round');
  svg.appendChild(path);
  grid.style.position='relative';
  grid.insertBefore(svg,grid.firstChild);
}

function renderSummary(){
  const now=new Date();let cleared=0;
  const oA=[],sR=[],aR=[],acR=[],mR=[];
  for(let m=1;m<=12;m++){
    const c=calcMonth(m);if(!c||c.overall==null)continue;
    oA.push(c.overall);if(c.overall>=100)cleared++;
    if(c.rates.sales!=null)sR.push(c.rates.sales);
    if(c.rates.accRate!=null)aR.push(c.rates.accRate);
    if(c.rates.ac!=null)acR.push(c.rates.ac);
    if(c.mainAvg!=null)mR.push(c.mainAvg);
  }
  const avg=r=>r.length?Math.round(r.reduce((a,b)=>a+b,0)/r.length):null;
  const setBar=(fi,vi,r)=>{const a=avg(r);$(fi).style.width=`${cap(a)}%`;$(vi).textContent=a!=null?`${a}%`:'--';};
  $('sCleared').textContent=cleared;
  $('sAvg').textContent=oA.length?`${avg(oA)}%`:'--';
  $('sActive').textContent=(S.year===new Date().getFullYear())?`${now.getMonth()+1}月`:'--';
  setBar('mf0','mv0',sR);setBar('mf1','mv1',acR);setBar('mf2','mv2',aR);setBar('mf3','mv3',mR);
}

// ── Stage View ────────────────────────────────────
function goStage(m){
  currentStage=m;
  const st=monthStatus(m),calc=calcMonth(m);
  const grade=st==='active'?'active':gradeOf(calc?.overall??null);
  $('sv-hdr').style.background=GRADE.bg[grade];
  $('sv-num').textContent=`STAGE ${m}`;
  $('sv-mname').textContent=MONTHS[m-1];
  $('sv-badge').textContent=GRADE.lbl[grade];
  renderStageBody(m,calc,grade);
  $('view-map').classList.remove('v-on');
  $('view-stage').classList.add('v-on');
  window.scrollTo(0,0);
}

function getDialogue(contrib,fair,typeIdx){
  const r=contrib/Math.max(fair,1);
  const w=typeIdx===0;
  if(r>=1.5) return w?'我就是MVP！🏆':'魔法全開！✨';
  if(r>=1.1) return w?'超額完成！💪':'施法成功！🔮';
  if(r>=0.9) return w?'打起精神！⚔️':'穩住魔力！🌟';
  if(r>=0.6) return w?'快追上去！💥':'魔力不足...💨';
  return w?'緊急出動！🚨':'需要補魔！😰';
}

function getStoreLine(grade){
  return{s:'🎊 完美通關！門市全員是英雄！',a:'⭐ 達標！優秀的銷售團隊！',b:'📈 表現不錯，再加把勁！',c:'💪 還有機會！全員衝刺！',d:'⚡ 緊急任務！需要全力以赴！',active:'🔥 進行中，努力衝刺吧！',locked:'🔒 等待英雄入場...'}[grade]||'';
}

function spawnConfetti(boxId,grade){
  const box=document.getElementById(boxId);if(!box)return;
  const cols=grade==='s'?['#F59E0B','#FBBF24','#FEF3C7','#F97316','#fff','#E879F9']:['#10B981','#34D399','#D1FAE5','#3B82F6','#C7D2F0','#fff'];
  const n=grade==='s'?55:30;
  for(let i=0;i<n;i++){
    const el=document.createElement('div');el.className='cf';
    const sz=6+Math.random()*9;
    el.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz}px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${Math.random()>.5?'50%':'2px'};animation-delay:${Math.random()*2}s;animation-duration:${1.4+Math.random()*1.6}s;opacity:1;`;
    box.appendChild(el);
  }
}

function renderStageBody(m,calc,grade){
  const body=$('sv-body');
  const targets=loadTgts()[m]||{};
  const pct=calc?.overall??null;
  const gc=GRADE.color[grade];
  const md=S.perf?.months?.[m];
  const storeLine=getStoreLine(grade);
  const slBorder=gc;
  const slBg=grade==='s'?'#FFFBEB':grade==='a'?'#ECFDF5':grade==='b'?'#EFF6FF':grade==='c'?'#FFF7ED':grade==='d'?'#FEF2F2':'#F4F7FF';
  let html='';

  // ── Store dialogue banner
  if(storeLine) html+=`<div class="store-line" style="background:${slBg};border-color:${slBorder};color:${slBorder}">${storeLine}</div>`;

  // ── Store overall hero
  const heroCls=grade==='d'?'hero-danger':(grade==='s'||grade==='a')?'hero-celebrate':'';
  html+=`
    <div class="sv-hero ${heroCls}" style="border-top:4px solid ${gc};position:relative;overflow:hidden">
      <div id="confetti-box" class="confetti-box"></div>
      <div class="hero-icon">${GRADE.icon[grade]}</div>
      <div class="hero-pct" style="color:${gc}">${pct!=null?pct+'%':'--'}</div>
      <div class="hero-right">
        <div class="hero-lbl">門市整體達成率 · STAGE ${m} ${MONTHS[m-1]}</div>
        <div class="hero-bar-trk"><div class="hero-bar-fill" style="width:${cap(pct)}%;background:${gc}"></div></div>
        <div class="hero-sub">${pct==null?'尚無業績資料，請設定目標並上傳 Excel':pct>=100?'🎉 完美！全員通關！':pct>=85?'✅ 達標！繼續保持':pct>=70?'📈 接近目標，加油衝刺':'⚡ 需要大力衝刺！'}</div>
      </div>
    </div>`;

  // ── Player cards
  if(md?.staffRows?.length){
    const names=[...new Set(md.staffRows.map(r=>r.name))];
    const N=names.length;
    const fairShare=Math.round(100/N);
    html+=`<div class="sv-sec"><div class="sv-sec-title">🎮 玩家個人進度 <span style="font-weight:400;font-size:11px;text-transform:none;letter-spacing:0">· 公平分配每人 ${fairShare}%</span></div><div class="players-grid">`;

    names.forEach((name,idx)=>{
      const ptype=PLAYER_TYPE[idx%2];
      const plbl=PLAYER_LABEL[idx%2];
      const rows=md.staffRows.filter(r=>r.name===name);
      const st={};
      for(const r of rows) for(const mk of METRICS){if(mk.key!=='accRate')st[mk.key]=(st[mk.key]||0)+(r[mk.key]||0);}
      // weighted accRate
      const mainK=['iphone','mac','ipad','watch'];
      let an=0,ad=0;
      for(const r of rows){const u=mainK.reduce((s,k)=>s+(r[k]||0),0);an+=(r.accRate||0)*u;ad+=u;}
      st.accRate=ad>0?Math.round(an/ad):0;

      // Contribution: person's actual / store total (sales)  × 100
      const totSales=calc?.tot?.sales||0;
      const salesContrib=totSales>0?Math.round(st.sales/totSales*100):0;
      // For each metric: person's actual / store target × 100%
      const metricContribs={};
      for(const mk of METRICS){
        if(mk.key==='accRate'){metricContribs[mk.key]=st.accRate;continue;}
        const tgtVal=targets[mk.key];
        const totActual=calc?.tot?.[mk.key]||0;
        // show as share of store total (always works even without target)
        metricContribs[mk.key]=totActual>0?Math.round(st[mk.key]/totActual*100):0;
      }

      // Overall player contribution = sales contrib (main metric)
      const mainPct=salesContrib;
      // Position of character on track (capped at 100 for visual, but label shows real)
      const trackPct=cap(mainPct,100);
      const fairPct=cap(fairShare,100);
      // Is above/below fair share?
      const status=mainPct>=fairShare?'🌟 超額貢獻':'📌 持續加油';

      // Build player card HTML
      const initial=name[0]||'?';
      const dialogue=getDialogue(salesContrib,fairShare,idx%2);
      html+=`
        <div class="pcard ${ptype}">
          <div class="pcard-top">
            <!-- Character figure + speech bubble -->
            <div class="char-wrap">
              <div class="speech-bubble">${dialogue}</div>
              <div class="char-hat"></div>
              <div class="char-head">${initial}</div>
              <div class="char-body"></div>
              <div class="char-arms">
                <div class="char-arm"></div>
                <div class="char-arm"></div>
              </div>
              <div class="char-legs">
                <div class="char-leg"></div>
                <div class="char-leg"></div>
              </div>
              <div class="char-type">${plbl}</div>
            </div>
            <!-- Info -->
            <div class="pcard-info">
              <div class="pcard-name">${name}</div>
              <div class="pcard-contrib-row">
                <div class="pcard-contrib-pct">${salesContrib}%</div>
                <div class="pcard-contrib-lbl">銷售貢獻<br>${status}</div>
              </div>
              <!-- Main progress track with character ON it -->
              <div class="pcard-track-wrap" style="padding-top:34px">
                <div class="pcard-track" style="overflow:visible;position:relative">
                  <div class="pcard-fill" style="width:${trackPct}%"></div>
                  <!-- Character on track (outside fill, so shimmer still works) -->
                  <div class="char-on-track" style="position:absolute;top:-30px;left:${trackPct}%">
                    <div class="char-mini-head">${initial}</div>
                    <div class="char-mini-body"></div>
                  </div>
                  <!-- Fair share marker -->
                  <div class="fair-marker" style="left:${fairPct}%">
                    <div class="fair-label">平均</div>
                  </div>
                  <!-- Finish line -->
                  <div class="finish-line"><div class="finish-label">100%</div></div>
                </div>
                <div class="track-labels">
                  <span class="track-lbl">0%</span>
                  <span class="track-lbl" style="color:${ptype==='p1'?'var(--p1a)':'var(--p2a)'};font-weight:700">銷售貢獻 ${salesContrib}%</span>
                </div>
              </div>
            </div>
          </div>
          <!-- Metric mini-bars -->
          <div class="pcard-metrics">`;

      // Show metric mini-bars (skip sales and accRate in grid, show accRate separately)
      const showMetrics=['iphone','mac','ipad','watch','ac','accRate'];
      for(const key of showMetrics){
        const mk=METRICS.find(m=>m.key===key);
        if(!mk)continue;
        const val=st[key]||0;
        const contrib=metricContribs[key]||0;
        const barPct=key==='accRate'?cap(val):cap(contrib);
        const dispVal=key==='accRate'?`${val}%`:`${val}${mk.unit}`;
        html+=`
          <div class="pm-row">
            <span class="pm-lbl">${mk.lbl}</span>
            <div class="pm-trk"><div class="pm-fill" style="width:${barPct}%;background:${mk.color}"></div></div>
            <span class="pm-val">${dispVal}</span>
          </div>`;
      }
      html+=`</div></div>`;
    });
    html+=`</div></div>`;
  } else {
    html+=`
      <div class="sv-sec">
        <div class="nodata">
          <div class="nodata-icon">🎮</div>
          <h3>尚無 ${MONTHS[m-1]} 業績資料</h3>
          <p>先設定本月目標，再上傳業績 Excel 即可看到玩家進度</p>
          <button class="tgt-save" onclick="document.getElementById('fileInp').click()" style="border:none;padding:10px 24px;cursor:pointer;border-radius:9px;">⬆ 上傳業績 Excel</button>
        </div>
      </div>`;
  }

  // ── Inline target panel
  html+=`
    <div class="sv-sec">
      <div class="sv-sec-title">🎯 本月目標設定</div>
      <div class="tgt-panel">
        <div class="tgt-grid">`;
  for(const mk of METRICS){
    html+=`
      <div class="tgt-grp">
        <label class="tgt-lbl">${mk.tLbl}</label>
        <input class="tgt-inp" id="sv-inp-${mk.key}" type="number" min="0" placeholder="0" value="${targets[mk.key]||''}">
      </div>`;
  }
  html+=`</div>
        <div class="tgt-row-btn">
          <span class="tgt-note">設定後重新整理關卡以套用計算</span>
          <button class="tgt-save" onclick="saveStageTgt(${m})">✅ 儲存目標</button>
        </div>
      </div>
    </div>`;

  body.innerHTML=html;
  if(grade==='s'||grade==='a') spawnConfetti('confetti-box',grade);
}

function saveStageTgt(m){
  const tgts=loadTgts();tgts[m]={};
  for(const mk of METRICS){const v=parseN($(`sv-inp-${mk.key}`)?.value);tgts[m][mk.key]=v;}
  saveTgts(tgts);
  const st=monthStatus(m),calc=calcMonth(m);
  const grade=st==='active'?'active':gradeOf(calc?.overall??null);
  $('sv-hdr').style.background=GRADE.bg[grade];
  $('sv-badge').textContent=GRADE.lbl[grade];
  renderStageBody(m,calc,grade);
  renderStages();renderSummary();
  showToast(`✅ ${MONTHS[m-1]} 目標已儲存`,'ok');
}

function goMap(){
  $('view-stage').classList.remove('v-on');
  $('view-map').classList.add('v-on');
  window.scrollTo(0,0);
  renderStages();renderSummary();
}

// ── Target Modal ──────────────────────────────────
function openTargetModal(m){
  tModalMonth=m||1;renderTabs();selectTab(tModalMonth);
  $('tOverlay').classList.add('open');
}
function closeTargetModal(){$('tOverlay').classList.remove('open');}
function renderTabs(){
  const tgts=loadTgts();
  $('mTabs').innerHTML=MONTHS.map((_,i)=>{
    const m=i+1,has=!!(tgts[m]&&Object.values(tgts[m]).some(v=>v>0));
    return `<div class="m-tab ${m===tModalMonth?'on':has?'has-d':''}" onclick="selectTab(${m})">${MONTHS[i]}</div>`;
  }).join('');
}
function selectTab(m){
  tModalMonth=m;
  const cur=loadTgts()[m]||{};
  $('tForm').innerHTML=METRICS.map(mk=>`
    <div class="inp-g">
      <label class="inp-lbl">${mk.tLbl}</label>
      <input class="inp-f" id="tinp-${mk.key}" type="number" min="0" placeholder="0" value="${cur[mk.key]||''}">
    </div>`).join('');
  renderTabs();
}
function saveTargetModal(){
  const tgts=loadTgts();tgts[tModalMonth]={};
  for(const mk of METRICS){const v=parseN($(`tinp-${mk.key}`)?.value);tgts[tModalMonth][mk.key]=v;}
  saveTgts(tgts);renderStages();renderSummary();renderTabs();
  showToast(`✅ ${MONTHS[tModalMonth-1]} 目標已儲存`,'ok');
}

// ── Upload ────────────────────────────────────────
function handleUpload(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const find=ns=>{for(const n of ns)if(wb.Sheets[n])return wb.Sheets[n];return null;};
      const tSh=find(['目標','targets'])||wb.Sheets[wb.SheetNames[0]];
      const pSh=find(['業績','performance'])||wb.Sheets[wb.SheetNames[1]];
      if(!tSh||!pSh){showToast('找不到目標/業績工作表','err');return;}
      const tgts=loadTgts();
      for(const row of XLSX.utils.sheet_to_json(tSh,{defval:''})){
        const m=parseInt(row['月份']||row['月']||0);if(m<1||m>12)continue;
        tgts[m]={sales:parseN(row['銷售額目標']||row['銷售額']),accRate:parseN(row['配件率目標%']||row['配件率目標']||row['配件率']),ac:parseN(row['AC目標']||row['AppleCare目標']||row['AC']),iphone:parseN(row['iPhone目標']||row['iPhone']),mac:parseN(row['Mac目標']||row['Mac']),ipad:parseN(row['iPad目標']||row['iPad']),watch:parseN(row['Watch目標']||row['Watch'])};
      }
      saveTgts(tgts);
      const months={};
      for(const row of XLSX.utils.sheet_to_json(pSh,{defval:''})){
        const m=parseInt(row['月份']||row['月']||0),name=String(row['姓名']||row['name']||'').trim();
        if(m<1||m>12||!name)continue;
        months[m]=months[m]||{staffRows:[]};
        months[m].staffRows.push({name,sales:parseN(row['銷售額']),accRate:parseN(row['配件率%']||row['配件率']),ac:parseN(row['AC']||row['AppleCare']),iphone:parseN(row['iPhone']),mac:parseN(row['Mac']),ipad:parseN(row['iPad']),watch:parseN(row['Watch'])});
      }
      S.perf={months};savePerf(S.perf);
      renderStages();renderSummary();
      if($('view-stage').classList.contains('v-on')){
        const st=monthStatus(currentStage),calc=calcMonth(currentStage);
        const grade=st==='active'?'active':gradeOf(calc?.overall??null);
        renderStageBody(currentStage,calc,grade);
      }
      showToast('✅ 業績資料載入成功！','ok');
    }catch(err){showToast('讀取失敗：'+err.message,'err');console.error(err);}
    e.target.value='';
  };
  reader.readAsArrayBuffer(file);
}

function dlTemplate(){
  const wb=XLSX.utils.book_new();
  const tD=[['月份','銷售額目標','配件率目標%','AC目標','iPhone目標','Mac目標','iPad目標','Watch目標']];
  for(let m=1;m<=12;m++)tD.push([m,'','','','','','','']);
  const tS=XLSX.utils.aoa_to_sheet(tD);tS['!cols']=[{wch:6},{wch:12},{wch:12},{wch:8},{wch:10},{wch:8},{wch:8},{wch:8}];
  XLSX.utils.book_append_sheet(wb,tS,'目標');
  const pD=[['月份','姓名','銷售額','配件率%','AC','iPhone','Mac','iPad','Watch'],[1,'專員A','','','','','','',''],[1,'專員B','','','','','','','']];
  const pS=XLSX.utils.aoa_to_sheet(pD);pS['!cols']=[{wch:6},{wch:8},{wch:10},{wch:8},{wch:6},{wch:8},{wch:6},{wch:6},{wch:8}];
  XLSX.utils.book_append_sheet(wb,pS,'業績');
  XLSX.writeFile(wb,'門市業績範本.xlsx');
}

function setYear(y){S.year=y;$('mapLbl').textContent=y;S.perf=loadPerf();renderStages();renderSummary();}
function showToast(msg,type='ok'){const t=$('toast');t.textContent=msg;t.className=`toast ${type} show`;setTimeout(()=>t.classList.remove('show'),3200);}

function init(){
  const cy=new Date().getFullYear(),sel=$('yearSel');sel.innerHTML='';
  for(let y=cy-1;y<=cy+1;y++){const o=document.createElement('option');o.value=y;o.textContent=`${y} 年`;if(y===cy)o.selected=true;sel.appendChild(o);}
  S.year=cy;S.perf=loadPerf();$('mapLbl').textContent=cy;
  renderStages();renderSummary();
  window.addEventListener('resize',()=>requestAnimationFrame(drawPath));
}
init();
</script>
